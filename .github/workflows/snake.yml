
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: KenReborn
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8B0000&color_dots=#ebedf0,#ffb3b3,#ff6666,#cc0000,#660000
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF0000&color_dots=#161b22,#500000,#800000,#b30000,#ff0000
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
